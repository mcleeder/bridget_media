# Captive-portal DNS for the setup hotspot.
#
# Installed to /etc/NetworkManager/dnsmasq-shared.d/, which NetworkManager
# only reads for *shared* (hotspot) connections — so this wildcard never
# applies while the box is a normal Wi-Fi client on someone's home network.
#
# Answering every name with the Pi's own address is what makes a phone's
# connectivity probe fail in the specific way that pops the "Sign in to
# network" sheet.
address=/#/10.42.0.1
